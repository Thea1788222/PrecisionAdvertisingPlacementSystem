<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>🛍️ 优购商城 - 智能购物平台</title>
    <!-- 添加杨宇程广告SDK -->
    <script src="http://10.100.164.35:8084/ad-tracker.js"></script>
    <meta name="description" content="优购商城 - 精选好物，智能推荐，优质购物体验">
    <meta name="keywords" content="购物,电商,优购商城,手机,数码,服装,家居">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 可以添加自定义favicon（可选） -->
    <!-- <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>"> -->

    <!-- 或者使用空白favicon -->
    <link rel="icon" href="data:image/x-icon;base64,">

    <!-- 引入杨宇程的广告追踪SDK -->
    <script src="http://localhost:8080/ad-tracker.js"></script>

    <script>
        // 初始化SDK（页面加载时立即执行）
        window.addEventListener('DOMContentLoaded', function() {
            if (window.adTracker) {
                window.adTracker.init({
                    trackerServer: 'http://localhost:8080',  // 杨宇程的服务地址
                    website: 'shop'                          // 网站类型：shop
                });
                console.log('广告追踪SDK初始化成功');
            } else {
                console.error('广告追踪SDK加载失败');
            }
        });
    </script>

    <!-- 可以添加一些基础样式（可选） -->
    <style>
        /* 隐藏favicon区域可能出现的默认图标 */
        link[rel="icon"] {
            display: none;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
